<!DOCTYPE html>
<html>
<head>
  <title>Fydz Official</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: black;
      color: white;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -2;
    }

    .container {
      text-align: center;
      padding-top: 60px;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(40px);}
      to {opacity:1; transform: translateY(0);}
    }

    .typing {
      font-size: 36px;
      color: cyan;
      border-right: 3px solid cyan;
      width: fit-content;
      margin: auto;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3s steps(20), blink .6s infinite alternate;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 220px }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      width: 360px;
      margin: 40px auto;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0,255,255,0.4);
      transition: 0.4s;
      transform-style: preserve-3d;
    }

    .card:hover {
      transform: rotateY(5deg) rotateX(5deg) scale(1.05);
      box-shadow: 0 0 60px cyan;
    }

    .avatar-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: auto;
    }

    .avatar {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      margin-top: 10px;
    }

    .ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 3px solid cyan;
      animation: spin 6s linear infinite;
      box-shadow: 0 0 25px cyan;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    p {
      margin: 10px 0;
    }

    a {
      color: cyan;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-shadow: 0 0 10px cyan;
    }

    .visitor-box {
      font-size: 22px;
      margin-top: 20px;
      color: cyan;
    }

  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">

  <div class="typing">Fydz Official</div>

  <div class="card">

    <div class="avatar-wrapper">
      <div class="ring"></div>
      <img src="profile.jpg" class="avatar">
    </div>

    <h2>My Profil</h2>
    <p><strong>Nama Dev:</strong> Fydz Official</p>
    <p><strong>Status:</strong> Web Developer</p>
    <p><strong>WhatsApp:</strong> 
      <a href="https://wa.me/6283120264665" target="_blank">
        6283120264665
      </a>
    </p>
    <p><strong>Telegram:</strong> 
      <a href="https://t.me/FydzXz" target="_blank">
        @FydzXz
      </a>
    </p>

    <div class="visitor-box">
      Visitors: <span id="visitorCount">0</span>
    </div>

  </div>

</div>

<script>

/* VISITOR */
let count = localStorage.getItem("visitors") || 0;
count++;
localStorage.setItem("visitors", count);
document.getElementById("visitorCount").innerText = count;

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];

for(let x = 0; x < columns; x++)
  drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "cyan";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 30);

</script>

</body>
    </html>
